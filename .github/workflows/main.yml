name: 编译OPPO/Realme-安卓12-通用mt6889机型内核
# 支持 SukiSU-Ultra / docker / lxc / kvm / Kali-Nethunter

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout 源码
      uses: actions/checkout@v4

    - name: 构建编译内核环境
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载 GCC 编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir gcc64
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -zxvf gcc-aarch64.tar.gz

        mkdir gcc32
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -zxvf gcc-arm.tar.gz

    - name: 下载 Clang 编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/zeng-github01/realme_X7_X7Pro_X7ProExtreme_X7-5G_Q2Pro_V15_V5_Q2_Narzo30pro-5G_7-5G-AndroidS-kernel-source.git android-kernel
        cd android-kernel

    - name: 更新 KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

    - name: 集成 SUSFS
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # 1. 克隆补丁仓库
        git clone -b 1.4.2-kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
        
        cd android-kernel

        # 2. 拷贝核心系统调用文件 (fs 和 include)
        cp ../susfs4ksu/kernel_patches/fs/* ./fs/
        cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

        # 3. 应用内核主体补丁 (50_add_susfs...)
        # 即使 sched.h 失败也继续，后续手动修复
        patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

        # 4. 【关键修复】手动注入 sched.h 缺失的代码
        # 既然自动补丁失败，我们用 sed 在 task_struct 结构体中注入变量
        # 查找 'void *security;' 并在其后添加 susfs 变量
        sed -i '/void.*\*security;/a \ \ \ \ #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t\tu64 android_kabi_reserved1;\n\t\tu64 android_kabi_reserved2;\n\t#endif' include/linux/sched.h

        # 5. 【路径修复】应用 KSU 侧的配置补丁 (10_enable_susfs_for_ksu.patch)
        # 注意：这个补丁内部包含 'kernel/Kconfig'，而你的 KSU 源码就在 'kernel/' 目录
        # 所以我们必须在内核根目录下运行，并且使用 -p1
        patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

    - name: 设置 ccache 缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-mt6853
        max-size: 2G

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        make -s -j$(nproc --all) O=out ARCH=arm64 rmx2121_defconfig
        make prepare CC="ccache clang" O=out ARCH=arm64 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld
        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld || (echo "::error 编译失败"; exit 1)
        make -j$(nproc) O=out ARCH=arm64   CC="ccache clang"   CLANG_TRIPLE=aarch64-linux-gnu-   CROSS_COMPILE=aarch64-linux-android-   CROSS_COMPILE_ARM32=arm-linux-androideabi-  modules
        make O=out ARCH=arm64 INSTALL_MOD_PATH=out/modules modules_install
        
    - name: 制作 AnyKernel3 卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ ! -f android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "::error Image.gz-dtb 未生成，编译失败"
          exit 1
        fi
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        find AnyKernel3/ -name ".git*" -exec rm -rf {} +
        rm -f AnyKernel3/README.md
        KERNEL_VER=4.14.186+
        DATE=$(date +%Y%m%d)
        cd AnyKernel3
        zip -r "KernelSU-${KERNEL_VER}-${DATE}.zip" ./*

    - name: 上传编译产物到 Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          kernel_workspace/AnyKernel3/KernelSU-*.zip
          kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
        name: ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
